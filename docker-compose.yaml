version: "3.8"

# =============================================================================
# Vélib Lakehouse — Docker Compose
# Services:
#   - velib-lakehouse: Dagster gRPC code server (port 4000, internal)
#   - velib-api: FastAPI serving layer (port 8000, public)
# Network: coolify (external)
# =============================================================================

# Dagster gRPC code server — serves pipeline assets to dagster-workspace
services:
  velib-lakehouse:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    container_name: velib-lakehouse
    expose:
      - "4000"
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DAGSTER_POSTGRES_USER=${DAGSTER_POSTGRES_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_POSTGRES_PASSWORD}
      - DAGSTER_POSTGRES_HOST=${DAGSTER_POSTGRES_HOST}
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - BUCKET=${BUCKET}
    # The gRPC port accepts connections (a plain socket: `dagster api grpc-health-check`
    # would load Dagster at every check)
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1', 4000), 3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - coolify
    restart: always

# FastAPI REST API — exposes pipeline metrics and Vélib insights
  velib-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: velib-api
    expose:
      - "8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - BUCKET=${BUCKET}
      - DAGSTER_URL=http://dagster-webserver:3000
    # /health answers without authentication
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - coolify
    restart: always

networks:
  coolify:
    external: true
    name: coolify